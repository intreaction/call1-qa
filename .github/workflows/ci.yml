name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CALL1_E2E_ROOT: /tmp/call1-e2e
      CALL1_EMBEDDING_BACKEND: fake
      CALL1_PII_MODEL_BACKEND: stub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate non-speech test fixtures
        run: python scripts/generate_test_audio.py
      - name: Run Python unit and integration tests
        run: python -m pytest tests -q --junitxml=output/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-results
          path: output/pytest.xml
          retention-days: 7
  browser:
    name: Frontend and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CALL1_E2E_ROOT: /tmp/call1-e2e
      CALL1_E2E_PYTHON: python
      CALL1_E2E_BROWSER: chromium
      CALL1_E2E_WORKERS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and test fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python scripts/generate_test_audio.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check types and build all apps
        working-directory: frontend
        run: |
          npm run typecheck
          npm run typecheck:e2e
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise demo, review sign-in, metrics and model controls
        working-directory: frontend
        run: npm run test:e2e -- smoke.spec.ts evaluate-metrics.spec.ts process-demo-call.spec.ts process-model-pipeline.spec.ts
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report
          path: ${{ env.CALL1_E2E_ROOT }}/playwright/report
          retention-days: 7
