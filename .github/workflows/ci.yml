name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the full Python suite and browser smoke tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python suite (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CALL1_E2E_ROOT: /tmp/call1-e2e
      CALL1_EMBEDDING_BACKEND: fake
      CALL1_PII_MODEL_BACKEND: stub
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate non-speech test fixtures
        run: python scripts/generate_test_audio.py
      - name: Run Python unit and integration tests
        run: python -m pytest tests -q --junitxml=output/pytest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-results
          path: output/pytest.xml
          retention-days: 7
  browser:
    name: Build and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CALL1_E2E_ROOT: /tmp/call1-e2e
      CALL1_E2E_PYTHON: python
      CALL1_E2E_BROWSER: chromium
      CALL1_E2E_WORKERS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch' && inputs.full_validation
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and test fixtures
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python scripts/generate_test_audio.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check types and build all apps
        working-directory: frontend
        run: |
          npm run typecheck
          npm run typecheck:e2e
          npm run build
      - name: Install Chromium
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise demo, review sign-in, metrics and model controls
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation
        working-directory: frontend
        run: npm run test:e2e -- smoke.spec.ts evaluate-metrics.spec.ts process-demo-call.spec.ts process-model-pipeline.spec.ts
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report
          path: ${{ env.CALL1_E2E_ROOT }}/playwright/report
          retention-days: 7
