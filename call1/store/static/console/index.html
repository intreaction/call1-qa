<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Call1 Store — Console</title>
    <link rel="icon" type="image/x-icon" href="/console/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/console/call1-dark-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/console/call1-dark-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/console/apple-touch-icon.png" />
    <script>
      /* Theme boot: apply the persisted choice (localStorage `call1-theme`) or the OS preference
         BEFORE first paint so the UI never flashes the wrong palette. Copied from
         frontend/index.html so the console matches the rest of the design system. Defaults to
         dark (Ink & Signal). */
      (function () {
        var theme = 'dark';
        try {
          var stored = null;
          try { stored = window.localStorage.getItem('call1-theme'); } catch (e) {}
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <script type="module" crossorigin src="/console/assets/store-console-CzyccCSk.js"></script>
    <link rel="stylesheet" crossorigin href="/console/assets/store-console-Bu4WU5lG.css">
  </head>
  <body class="h-screen w-screen flex flex-col font-sans overflow-hidden antialiased text-sm call1-app">
    <div id="root" class="flex-1 flex flex-col min-h-0 overflow-y-auto"></div>
  </body>
</html>
